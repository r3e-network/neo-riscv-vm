[workspace]
resolver = "2"
members = [
    "crates/neo-riscv-abi",
    "crates/neo-riscv-guest",
    "crates/neo-riscv-guest-module",
    "crates/neo-riscv-host",
    "crates/neo-riscv-devpack",
    "crates/neo-riscv-contract-harness",
]
exclude = [
    "examples/counter",
    "examples/storage",
    "examples/hello-world",
    "examples/nep17-token",
    "examples/devpack-test",
]
default-members = [
    "crates/neo-riscv-abi",
    "crates/neo-riscv-guest",
    "crates/neo-riscv-host",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
neo-vm-rs = { git = "https://github.com/r3e-network/neo-vm-rs.git", rev = "6db9b0536a6ef9596e013b8ace3acb760b4ddd98", default-features = false }
polkavm = "0.33.1"
polkavm-derive = "0.33.0"
postcard = { version = "1.1.3", features = ["alloc"] }
criterion = "0.5"
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
proptest = "1.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
sha2 = { version = "0.10", default-features = false }

[profile.release]
panic = "abort"
opt-level = 3
lto = "thin"

[profile.dev]
panic = "abort"
