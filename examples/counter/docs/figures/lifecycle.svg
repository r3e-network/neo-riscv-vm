<rect class="bg" width="1920" height="1180"/>
<text x="56" y="66" class="title">counter: Runtime Lifecycle</text>
<text x="56" y="98" class="subtitle">Neo N4 paper-style technical figure - from configuration through execution, evidence, and operation</text>
