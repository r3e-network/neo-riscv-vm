<text x="76" y="143" class="small">Read as: <tspan class="bodyStrong">technical-principle figure, not implementation inventory</tspan> · Boundary: guest cannot mutate chain state directly; host/syscall boundary authorizes effects · Out of scope: does not own proof generation, bridge custody, or L1 finality</text>
